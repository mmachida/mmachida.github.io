<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NightReign DB</title>

<style>
body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.navbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: #0b1020;
    border-bottom: 1px solid #1e293b;
}

.page-subtitle {
    margin-top: -6px;
    color: #94a3b8;
    font-size: 1rem;
    text-align: left;
}

#bossSearch {
    width: 100%;
    max-width: 260px;
    margin-left: auto;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 10px;
}

.brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.brand-title {
    font-weight: 800;
    color: #f8fafc;
    font-size: 18px;
}

.browse-wrapper {
    position: relative;
}

.browse-button {
    width: auto;
    margin-top: 0;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #334155;
    background: #111827;
    color: #cbd5e1;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
}

.browse-button:hover {
    background: #1e293b;
}

.browse-menu {
    display: none;
    position: absolute;
    top: 46px;
    left: 0;
    min-width: 220px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 8px;
    z-index: 100;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
}

.browse-menu.open {
    display: block;
}

.browse-menu button {
    width: 100%;
    margin: 0;
    padding: 10px 12px;
    background: transparent;
    border: none;
    color: #cbd5e1;
    text-align: left;
    border-radius: 10px;
    cursor: pointer;
}

.browse-menu button:hover {
    background: #1e293b;
    color: white;
}

.navbar a {
    color: #94a3b8;
    cursor: pointer;
    text-decoration: none;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
}

.navbar a.active {
    color: white;
    background: #1e1b4b;
    border-bottom: 2px solid #6366f1;
}

.container {
    padding: 30px;
    max-width: 1600px;
    margin: auto;
}

.box {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

select, button, input {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    background: #020617;
    color: white;
    border: 1px solid #334155;
    border-radius: 6px;
}

button:hover {
    background: #1e293b;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 18px;
    align-items: end;
}

.mode-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.mode-tabs button {
    width: auto;
    margin-top: 0;
    padding: 9px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 800;
}

.mode-tabs button.active {
    background: #4f46e5;
    border-color: #818cf8;
    color: white;
}

.muted {
    color: #94a3b8;
    font-size: 0.9rem;
}

.category-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.category-header h2 {
    margin: 0;
}

.count-pill {
    background: #1e1b4b;
    border: 1px solid #6366f1;
    color: #c4b5fd;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 800;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

.boss-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 1180px;
}

.boss-table th,
.boss-table td {
    border-bottom: 1px solid #1e293b;
    border-right: 1px solid #172033;
    padding: 6px 5px;
    text-align: center;
    font-size: 0.78rem;
    white-space: nowrap;
}

.boss-table th {
    background: #111827;
    color: #c4b5fd;
    font-weight: 900;
    position: sticky;
    top: 0;
    z-index: 1;
}

.boss-table tr:hover td {
    background: #111c2f;
}

.col-name {
    width: 190px;
    text-align: left !important;
}

.col-hp {
    width: 82px;
}

.col-variant {
    width: 82px;
}

.icon-col {
    width: 44px;
}

.boss-name {
    font-weight: 900;
    color: #f8fafc;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
}

.variant-pill {
    display: inline-block;
    padding: 2px 6px;
    font-size: 0.68rem;
    border-radius: 999px;
    background: #1e293b;
    color: #cbd5e1;
}

.variant-enhanced {
    background: #581c87;
    color: #f5d0fe;
}

.variant-day1 {
    background: #14532d;
    color: #bbf7d0;
}

.variant-day2 {
    background: #1e3a8a;
    color: #bfdbfe;
}

.variant-basement {
    background: #713f12;
    color: #fde68a;
}

.variant-rooftop {
    background: #0f766e;
    color: #ccfbf1;
}

.variant-tier1 {
    background: #064e3b;
    color: #a7f3d0;
}

.variant-tier2 {
    background: #854d0e;
    color: #fde68a;
}

.variant-tier3 {
    background: #7f1d1d;
    color: #fecaca;
}

.variant-crater {
    background: #991b1b;
    color: #fee2e2;
}

.variant-noklateo {
    background: #581c87;
    color: #f5d0fe;
}

.variant-mountaintops {
    background: #075985;
    color: #bae6fd;
}

.hp-cell {
    font-weight: 900;
    color: #bae6fd;
}

.pos {
    color: #fecaca;
    background: rgba(239, 68, 68, 0.12);
}

.neg {
    color: #bbf7d0;
    background: rgba(34, 197, 94, 0.12);
}

.immune {
    color: #cbd5e1;
    background: rgba(100, 116, 139, 0.18);
}

.yes {
    color: #e9d5ff;
    background: rgba(168, 85, 247, 0.18);
    font-weight: 900;
}

.group-head {
    font-size: 0.72rem !important;
    color: #f8fafc !important;
}

.dmg-head {
    background: #1e293b !important;
}

.aff-head {
    background: #172554 !important;
}

.status-head {
    background: #312e81 !important;
}

.weak-head {
    background: #3b0764 !important;
}

.legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.legend span {
    font-size: 0.76rem;
    color: #94a3b8;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 4px 8px;
}

.no-data {
    color: #94a3b8;
    padding: 10px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
}

@media (max-width: 900px) {
    .navbar {
        flex-wrap: wrap;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="navbar">

    <div class="brand">
        <div class="brand-icon">⚔️</div>
        <div class="brand-title">Nightreign Database</div>
    </div>

    <div class="browse-wrapper">
        <button class="browse-button" onclick="toggleBrowseMenu()">
            ☰ Browse ⌄
        </button>

        <div id="browseMenu" class="browse-menu">
            <button onclick="navigateFromMenu('home')">Bosses</button>
            <button onclick="navigateFromMenu('journey')">Boss Prediction</button>
            <button onclick="navigateFromMenu('about')">About</button>
        </div>
    </div>

    <a onclick="navigate('home')" class="active">Bosses</a>
    <a onclick="navigate('journey')">Boss Prediction</a>
    <a onclick="navigate('about')">About</a>
</div>

<div id="app"></div>

<script>
let rawData = [];
let fields = [];
let filters = {};
let currentPage = "home";

let bossesData = null;
let currentMode = "solo";
let bossSearch = "";

const damageLabels = [
    ["phys", "⚔️", "Physical"],
    ["slash", "🗡️", "Slash"],
    ["strike", "🔨", "Strike"],
    ["pierce", "🏹", "Pierce"],
    ["magic", "✨", "Magic"],
    ["fire", "🔥", "Fire"],
    ["lightning", "⚡", "Lightning"],
    ["holy", "☀️", "Holy"]
];

const affinityLabels = [
    ["poison", "☠️", "Poison"],
    ["rot", "🧫", "Rot"],
    ["bleed", "🩸", "Bleed"],
    ["frostbite", "❄️", "Frostbite"],
    ["sleep", "💤", "Sleep"],
    ["madness", "👁️", "Madness"],
    ["deathBlight", "💀", "Death Blight"]
];

const statusLabels = [
    ["bleed", "🩸", "Bleed Multiplier"],
    ["frost", "❄️", "Frost Multiplier"],
    ["sleep", "💤", "Sleep Multiplier"],
    ["madness", "👁️", "Madness Multiplier"]
];

const weakLabels = [
    ["gravityVoid", "🌀", "Gravity / Void"],
    ["liveInDeath", "🦴", "Live in Death"],
    ["ancientDragon", "🐉", "Ancient Dragon"],
    ["dragonWyrm", "🐲", "Dragon / Wyrm"]
];

function navigate(page) {
    currentPage = page;

    document.querySelectorAll(".navbar a").forEach(a => {
        a.classList.remove("active");
        if ((a.getAttribute("onclick") || "").includes(page)) {
            a.classList.add("active");
        }
    });

    renderPage();
}

function navigateFromMenu(page) {
    navigate(page);
    document.getElementById("browseMenu").classList.remove("open");
}

function toggleBrowseMenu() {
    document.getElementById("browseMenu").classList.toggle("open");
}

document.addEventListener("click", function(e) {
    const wrapper = document.querySelector(".browse-wrapper");
    if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById("browseMenu").classList.remove("open");
    }
});

async function loadData() {
    const predictionRes = await fetch("./config_data.json");
    const config = await predictionRes.json();

    fields = config.fields;
    rawData = config.data;
    fields.slice(1).forEach(f => filters[f] = "(all)");

    try {
        const bossesRes = await fetch("./bosses_data.json");
        bossesData = await bossesRes.json();
    } catch (err) {
        console.error("Could not load bosses_data.json", err);
        bossesData = null;
    }

    renderPage();
}

function renderPage() {
    if (currentPage === "home") renderHome();
    if (currentPage === "journey") renderJourney();
    if (currentPage === "about") renderAbout();
}

function renderHome() {
    document.getElementById("app").innerHTML = `
    <div class="container">
        <h1>Bosses</h1>

        <div class="box">
            <div class="controls">
                <div>
                    <div class="muted">Mode</div>
                    <div class="mode-tabs">
                        <button id="mode-solo" onclick="setMode('solo')">Solo</button>
                        <button id="mode-duo" onclick="setMode('duo')">Duo</button>
                        <button id="mode-trio" onclick="setMode('trio')">Trio</button>
                    </div>
                </div>

                <div>
                    <label class="muted">Search</label>
                    <input
                        id="bossSearch"
                        placeholder="Search boss..."
                        value="${escapeHtml(bossSearch)}"
                        oninput="setBossSearch(this.value)"
                    />
                </div>
            </div>

            <div class="legend">
                <span>⚔️ Phys</span>
                <span>🗡️ Slash</span>
                <span>🔨 Strike</span>
                <span>🏹 Pierce</span>
                <span>✨ Magic</span>
                <span>🔥 Fire</span>
                <span>⚡ Lightning</span>
                <span>☀️ Holy</span>
                <span>🩸 Bleed</span>
                <span>❄️ Frost</span>
                <span>💤 Sleep</span>
                <span>👁️ Madness</span>
                <span>T1/T2/T3 = Tier</span>
                <span>Crtr = Crater</span>
                <span>Nok = Noklateo</span>
                <span>Mtn = Mountaintops</span>
            </div>
        </div>

        <div id="bossCategories"></div>
    </div>`;

    updateModeButtons();
    renderBossCategories();
}

function setMode(mode) {
    currentMode = mode;
    updateModeButtons();
    renderBossCategories();
}

function updateModeButtons() {
    ["solo", "duo", "trio"].forEach(mode => {
        const el = document.getElementById(`mode-${mode}`);
        if (el) el.classList.toggle("active", currentMode === mode);
    });
}

function setBossSearch(value) {
    bossSearch = value;
    renderBossCategories();
}

function renderBossCategories() {
    const root = document.getElementById("bossCategories");
    if (!root) return;

    if (!bossesData || !bossesData.categories) {
        root.innerHTML = `
            <div class="box">
                <p class="no-data">Could not load bosses_data.json.</p>
            </div>`;
        return;
    }

    const query = bossSearch.trim().toLowerCase();
    let html = "";

    bossesData.categories.forEach(category => {
        const rows = (category.rows || []).filter(row => {
            if (!query) return true;
            return JSON.stringify(row).toLowerCase().includes(query);
        });

        if (rows.length === 0) return;

        html += `
        <div class="box">
            <div class="category-header">
                <h2>${escapeHtml(category.title)}</h2>
                <span class="count-pill">${rows.length} entries</span>
            </div>

            <div class="table-wrap">
                <table class="boss-table">
                    <thead>
                        <tr>
                            <th rowspan="2" class="col-name">Name</th>
                            <th rowspan="2" class="col-hp">HP</th>
                            <th rowspan="2" class="col-variant">Variant</th>
                            <th colspan="8" class="group-head dmg-head">Dmg Res</th>
                            <th colspan="7" class="group-head aff-head">Affinity Res</th>
                            <th colspan="4" class="group-head status-head">Status Mult</th>
                            <th colspan="4" class="group-head weak-head">Weak</th>
                        </tr>
                        <tr>
                            ${damageLabels.map(([key, icon, title]) => headIcon(icon, title)).join("")}
                            ${affinityLabels.map(([key, icon, title]) => headIcon(icon, title)).join("")}
                            ${statusLabels.map(([key, icon, title]) => headIcon(icon, title)).join("")}
                            ${weakLabels.map(([key, icon, title]) => headIcon(icon, title)).join("")}
                        </tr>
                    </thead>
                    <tbody>
                        ${rows.map(renderBossRow).join("")}
                    </tbody>
                </table>
            </div>
        </div>`;
    });

    if (!html) {
        html = `
        <div class="box">
            <p class="no-data">No bosses found for "${escapeHtml(bossSearch)}".</p>
        </div>`;
    }

    root.innerHTML = html;
}

function headIcon(icon, title) {
    return `<th class="icon-col" title="${escapeHtml(title)}">${icon}</th>`;
}

function renderBossRow(row) {
    const hp = row.hp?.[currentMode] ?? "";
    const status = row.statusMultiplier?.[currentMode] || {};
    const variantInfo = getVariantInfo(row.variant);

    return `
    <tr>
        <td class="boss-name" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</td>
        <td class="hp-cell">${formatValue(hp)}</td>
        <td>
            <span class="variant-pill ${variantInfo.className}" title="${escapeHtml(row.variant || "Normal")}">
                ${variantInfo.label}
            </span>
        </td>

        ${damageLabels.map(([key]) => renderValueCell(row.damageResistance?.[key], true)).join("")}
        ${affinityLabels.map(([key]) => renderValueCell(row.affinityResistance?.[key], false)).join("")}
        ${statusLabels.map(([key]) => renderValueCell(status?.[key], false)).join("")}
        ${weakLabels.map(([key]) => renderWeakCell(row.weakDamageType?.[key])).join("")}
    </tr>`;
}

function getVariantInfo(variant) {
    const raw = String(variant || "Normal");
    const value = raw.toLowerCase().trim();

    if (value.includes("enhanced") || value.includes("phase")) {
        return { label: "Enh.", className: "variant-enhanced" };
    }

    if (value.includes("tier 1") || value === "t1") {
        return { label: "T1", className: "variant-tier1" };
    }

    if (value.includes("tier 2") || value === "t2") {
        return { label: "T2", className: "variant-tier2" };
    }

    if (value.includes("tier 3") || value === "t3") {
        return { label: "T3", className: "variant-tier3" };
    }

    if (value.includes("day 1")) {
        return { label: "D1", className: "variant-day1" };
    }

    if (value.includes("day 2")) {
        return { label: "D2", className: "variant-day2" };
    }

    if (value.includes("basement") || value.includes("basemente")) {
        return { label: "Base", className: "variant-basement" };
    }

    if (value.includes("rooftop")) {
        return { label: "Roof", className: "variant-rooftop" };
    }

    if (value.includes("crater")) {
        return { label: "Crtr", className: "variant-crater" };
    }

    if (value.includes("noklateo")) {
        return { label: "Nok", className: "variant-noklateo" };
    }

    if (
        value.includes("mountain tops") ||
        value.includes("mountaintops") ||
        value.includes("mountain top") ||
        value.includes("mountaintop")
    ) {
        return { label: "Mtn", className: "variant-mountaintops" };
    }

    if (value.includes("normal")) {
        return { label: "Norm.", className: "" };
    }

    return {
        label: escapeHtml(raw.length > 8 ? raw.slice(0, 8) : raw),
        className: ""
    };
}

function renderValueCell(value, signed) {
    let cls = "";

    if (String(value).toLowerCase() === "immune") {
        cls = "immune";
    } else if (signed && Number(value) > 0) {
        cls = "pos";
    } else if (signed && Number(value) < 0) {
        cls = "neg";
    }

    return `<td class="${cls}">${formatValue(value)}</td>`;
}

function renderWeakCell(value) {
    const yes = String(value).toLowerCase() === "yes";
    return `<td class="${yes ? "yes" : ""}">${yes ? "✓" : "-"}</td>`;
}

function formatValue(value) {
    if (value === null || value === undefined || value === "") return "-";

    if (typeof value === "number") {
        if (Number.isInteger(value) && value >= 1000) {
            return value.toLocaleString("en-US");
        }

        return String(value);
    }

    const text = String(value);

    if (text.toLowerCase() === "immune") return "Imm";

    return escapeHtml(text);
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* BOSS PREDICTION */
function getFilteredData() {
    return rawData.filter(row => {
        return fields.slice(1).every((f, i) => {
            return filters[f] === "(all)" || row[i+1] === filters[f];
        });
    });
}

function computeOptions(field) {
    let temp = rawData;

    fields.slice(1).forEach(f => {
        if (f === field) return;
        if (filters[f] !== "(all)") {
            const idx = fields.indexOf(f);
            temp = temp.filter(r => r[idx] === filters[f]);
        }
    });

    const index = fields.indexOf(field);
    let values = [...new Set(temp.map(r => r[index]))].sort();

    return ["(all)", ...values];
}

function renderJourney() {
    document.getElementById("app").innerHTML = `
    <div class="container">

		<h1>Boss Prediction</h1>
		<p class="page-subtitle">
			Predict the random Night Lord in Deep of Night 3 or higher.
		</p>
        <div class="grid">
            <div class="box">
                <h3>Conditions</h3>
                <div id="filters"></div>
                <button onclick="resetFilters()">Reset</button>
            </div>

            <div class="box">
                <h3>Probability</h3>
                <div id="probability"></div>
            </div>
        </div>

        <div class="box">
            <h3>Possible Combinations</h3>
            <div id="table"></div>
        </div>

    </div>`;

    renderFilters();
    update();
}

function renderAbout() {
    document.getElementById("app").innerHTML = `
    <div class="container">
        <h1>About</h1>
        <div class="box">
            <p>Created by GrandeMOficial</p>
        </div>
    </div>`;
}

function renderFilters() {
    const container = document.getElementById("filters");
    if (!container) return;

    container.innerHTML = "";

    fields.slice(1).forEach(f => {
        const select = document.createElement("select");

        select.onchange = (e) => {
            filters[f] = e.target.value;
            renderFilters();
            update();
        };

        computeOptions(f).forEach(opt => {
            const option = document.createElement("option");
            option.value = opt;
            option.text = opt;
            if (filters[f] === opt) option.selected = true;
            select.appendChild(option);
        });

        container.appendChild(document.createTextNode(f));
        container.appendChild(select);
    });
}

function update() {
    const data = getFilteredData();
    renderTable(data);
    renderProbability(data);
}

function renderTable(data) {
    const el = document.getElementById("table");
    if (!el) return;

    if (data.length === 0) {
        el.innerHTML = "No data";
        return;
    }

    let html = "<table><tr>";
    fields.forEach(f => html += `<th>${escapeHtml(f)}</th>`);
    html += "</tr>";

    data.forEach(row => {
        html += "<tr>";
        row.forEach(cell => html += `<td>${escapeHtml(cell)}</td>`);
        html += "</tr>";
    });

    html += "</table>";
    el.innerHTML = html;
}

function renderProbability(data) {
    const el = document.getElementById("probability");
    if (!el) return;

    const index = fields.indexOf("Night Lord");

    if (data.length === 0) {
        el.innerHTML = "No data";
        return;
    }

    const counts = {};

    data.forEach(r => {
        counts[r[index]] = (counts[r[index]] || 0) + 1;
    });

    let html = "<table><tr><th>Boss</th><th>%</th></tr>";

    Object.entries(counts).forEach(([k,v]) => {
        let pct = ((v / data.length) * 100).toFixed(2);
        html += `<tr><td>${escapeHtml(k)}</td><td>${pct}%</td></tr>`;
    });

    html += "</table>";
    el.innerHTML = html;
}

function resetFilters() {
    fields.slice(1).forEach(f => filters[f] = "(all)");
    renderFilters();
    update();
}

loadData();
</script>
