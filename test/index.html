<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulador RPG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    input {
      padding: 5px;
      margin: 5px;
      width: 80px;
    }

    button {
      padding: 6px 10px;
      cursor: pointer;
    }

    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #222;
    }

    tr:nth-child(even) {
      background: #1a1a1a;
    }
  </style>
</head>
<body>

<h2>Simulador de Personagem</h2>

<div>
  Nome: <input type="text" id="nome">
  STR: <input type="number" id="str" value="0">
  DEX: <input type="number" id="dex" value="0">
  INT: <input type="number" id="int" value="0">
  <button onclick="adicionarPersonagem()">Adicionar</button>
</div>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>STR</th>
      <th>DEX</th>
      <th>INT</th>
      <th>Dano Físico</th>
      <th>Dano Mágico</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody id="tabelaBody"></tbody>
</table>

<script>

let personagens = JSON.parse(localStorage.getItem("personagens")) || [];

function calcularDanoFisico(str, dex) {
  return (str * 2) + (dex * 1.5);
}

function calcularDanoMagico(int) {
  return int * 3;
}

function salvarLocal() {
  localStorage.setItem("personagens", JSON.stringify(personagens));
}

function renderizarTabela() {
  const body = document.getElementById("tabelaBody");
  body.innerHTML = "";

  personagens.forEach((p, index) => {
    let linha = document.createElement("tr");

    linha.innerHTML = `
      <td>${p.nome}</td>
      <td>${p.str}</td>
      <td>${p.dex}</td>
      <td>${p.int}</td>
      <td>${calcularDanoFisico(p.str, p.dex)}</td>
      <td>${calcularDanoMagico(p.int)}</td>
      <td><button onclick="removerPersonagem(${index})">Remover</button></td>
    `;

    body.appendChild(linha);
  });
}

function adicionarPersonagem() {
  const nome = document.getElementById("nome").value;
  const str = Number(document.getElementById("str").value);
  const dex = Number(document.getElementById("dex").value);
  const int = Number(document.getElementById("int").value);

  if (!nome) {
    alert("Digite um nome");
    return;
  }

  personagens.push({ nome, str, dex, int });

  salvarLocal();
  renderizarTabela();

  document.getElementById("nome").value = "";
}

function removerPersonagem(index) {
  personagens.splice(index, 1);
  salvarLocal();
  renderizarTabela();
}

renderizarTabela();

</script>

</body>
</html>
