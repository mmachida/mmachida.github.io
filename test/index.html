<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CV2 Overburden Calculator</title>

<style>
body {
    background: #0f0f0f;
    color: #eee;
    font-family: Arial;
    padding: 20px;
}

h2 { margin-bottom: 5px; }

select {
    width: 250px;
    padding: 5px;
    margin-bottom: 10px;
}

.section {
    margin-bottom: 20px;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #1a1a1a;
}

.stat-line {
    margin-bottom: 5px;
}
</style>
</head>

<body>

<h2>CV2 Overburden Calculator</h2>

<div class="section">
    <label>Blood Code</label><br>
    <select id="bloodCode"></select>
</div>

<div class="section">
    <label>Partner</label><br>
    <select id="partner"></select>
</div>

<div class="section">
    <label>Jail</label><br>
    <select id="jail"></select>
</div>

<div class="section">
    <label>Defensive Formae</label><br>
    <select id="defensive"></select>
</div>

<div class="section">
    <label>Weapon 1</label><br>
    <select id="weapon1"></select><br>

    <label>Weapon 2</label><br>
    <select id="weapon2"></select>
</div>

<div class="section">
    <label>Booster</label><br>
    <select id="booster"></select>
</div>

<div class="result" id="results"></div>

<script>

/* ===========================
   DATA (substitui o Excel)
=========================== */

const bloodCodes = [
{
    name: "Valentin",
    stats: { STR:14, DEX:14, MND:8, WIL:15, VIT:7, FOR:14 }
},
{
    name: "Example Build",
    stats: { STR:20, DEX:10, MND:5, WIL:12, VIT:15, FOR:8 }
}
];

const partners = [
{
    name: "None",
    stats: { STR:0, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
}
];

const jails = [
{
    name: "None",
    stats: { STR:0, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
}
];

const defensiveFormae = [
{
    name: "None",
    stats: { STR:0, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
}
];

const weapons = [
{
    name: "None",
    burden: { STR:0, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
},
{
    name: "Huge Hammer",
    burden: { STR:20, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
},
{
    name: "Light Blade",
    burden: { STR:5, DEX:10, MND:0, WIL:0, VIT:0, FOR:0 }
}
];

const boosters = [
{
    name: "None",
    stats: { STR:0, DEX:0, MND:0, WIL:0, VIT:0, FOR:0 }
}
];

/* ===========================
   UTIL
=========================== */

function populate(id, array) {
    const select = document.getElementById(id);
    array.forEach((item, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.textContent = item.name;
        select.appendChild(opt);
    });
}

populate("bloodCode", bloodCodes);
populate("partner", partners);
populate("jail", jails);
populate("defensive", defensiveFormae);
populate("weapon1", weapons);
populate("weapon2", weapons);
populate("booster", boosters);

document.querySelectorAll("select").forEach(el => {
    el.addEventListener("change", calculate);
});

/* ===========================
   CALCULATION
=========================== */

function calculate() {

    const bc = bloodCodes[bloodCode.value];
    const pt = partners[partner.value];
    const jl = jails[jail.value];
    const df = defensiveFormae[defensive.value];
    const w1 = weapons[weapon1.value];
    const w2 = weapons[weapon2.value];
    const bs = boosters[booster.value];

    let finalStats = {};

    for (let stat in bc.stats) {
        finalStats[stat] =
            bc.stats[stat] +
            pt.stats[stat] +
            jl.stats[stat] +
            df.stats[stat] +
            bs.stats[stat] +
            w1.burden[stat] +
            w2.burden[stat];
    }

    /* ===== Regras principais ===== */

    // Regra exemplo Overburden
    const overburden = finalStats.STR > 40 ? "YES" : "NO";

    // Normal Roll exemplo
    const normalRoll = finalStats.VIT >= 20 ? "YES" : "NO";

    // Dodge effectiveness exemplo
    const dodge = finalStats.DEX + finalStats.FOR;

    /* ============================= */

    results.innerHTML = `
        <div class="stat-line">STR: ${finalStats.STR}</div>
        <div class="stat-line">DEX: ${finalStats.DEX}</div>
        <div class="stat-line">MND: ${finalStats.MND}</div>
        <div class="stat-line">WIL: ${finalStats.WIL}</div>
        <div class="stat-line">VIT: ${finalStats.VIT}</div>
        <div class="stat-line">FOR: ${finalStats.FOR}</div>
        <hr>
        <div class="stat-line">Overburdened: ${overburden}</div>
        <div class="stat-line">Normal Roll: ${normalRoll}</div>
        <div class="stat-line">Dodge Effectiveness: ${dodge}</div>
    `;
}

calculate();

</script>

</body>
</html>
