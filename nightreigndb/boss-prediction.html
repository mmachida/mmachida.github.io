<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NightReign DB - Boss Prediction</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/version.js"></script>
<script>
document.write(`<link rel="stylesheet" href="css/style.css?v=${window.APP_VERSION}">`);
</script>
<script src="js/shared.js" defer></script>
<script src="js/boss-prediction.js" defer></script>

<link rel="icon" href="img/favicon/favicon.svg?v=${window.APP_VERSION}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png?v=${window.APP_VERSION}">
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png?v=${window.APP_VERSION}">
</head>

<body data-page="boss-prediction">

<div id="header"></div>
<main class="page-content">

<div class="container">
    <h1>Boss Prediction</h1>
    <p class="page-subtitle">
        Depth 3 and above can run unknown bosses, see the combinations below to identify which boss you are going to fight
    </p>

    <div class="grid">
        <div class="box">
            <h3>Conditions</h3>
            <div id="filters"></div>
            <button onclick="resetFilters()">Reset</button>
        </div>

        <div class="box">
            <h3>Probability</h3>
            <div id="probability"></div>
        </div>
    </div>

    <div class="box">
        <h3>Possible Combinations</h3>
        <div id="table"></div>
    </div>
	

</div>
</main>
<div id="footer"></div>
<script>
fetch(`components/footer.html?v=${window.APP_VERSION}`)
    .then(res => res.text())
    .then(data => {
        document.getElementById("footer").innerHTML = data;
    });
</script>
</body>
</html>
