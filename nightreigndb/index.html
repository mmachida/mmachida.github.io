<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NightReign DB - Bosses</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/version.js"></script>
<script>
document.write(`<link rel="stylesheet" href="css/style.css?v=${window.APP_VERSION}">`);
</script>
<script src="js/shared.js" defer></script>
<script src="js/bosses.js" defer></script>
</head>

<body data-page="bosses">

<div id="header"></div>

<div class="container">
    <h1>Bosses</h1>

    <div class="box">
        <div class="controls">
            <div>
                <div class="muted">Mode</div>
                <div class="mode-tabs">
                    <button id="mode-solo" onclick="setMode('solo')">Solo</button>
                    <button id="mode-duo" onclick="setMode('duo')">Duo</button>
                    <button id="mode-trio" onclick="setMode('trio')">Trio</button>
                </div>
            </div>

            <div>
                <label class="muted">Search</label>
                <input
                    id="bossSearch"
                    placeholder="Search boss..."
                    oninput="setBossSearch(this.value)"
                />
            </div>
        </div>

        <div class="legend">
            <span>⚔️ Phys</span>
            <span>🗡️ Slash</span>
            <span>🔨 Strike</span>
            <span>🏹 Pierce</span>
            <span>✨ Magic</span>
            <span>🔥 Fire</span>
            <span>⚡ Lightning</span>
            <span>☀️ Holy</span>
            <span>🩸 Bleed</span>
            <span>❄️ Frost</span>
            <span>💤 Sleep</span>
            <span>👁️ Madness</span>
            <span>T1/T2/T3 = Tier</span>
            <span>Crtr = Crater</span>
            <span>Nok = Noklateo</span>
            <span>Mtn = Mountaintops</span>
        </div>
    </div>

    <div id="bossCategories"></div>
</div>
</body>
</html>
