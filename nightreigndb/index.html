<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bosses - Nightreign DB</title>
<meta name="description" content="Complete Nightreign fan database with bosses, Deep of Night mechanics, relic effects, and weapon effects.">
<meta name="author" content="M">
<link rel="stylesheet" href="css/style.css">
<script src="js/version.js"></script>
<script>
document.write(`<link rel="stylesheet" href="css/style.css?v=${window.APP_VERSION}">`);
</script>
<script src="js/shared.js" defer></script>
<script src="js/bosses.js" defer></script>

<link rel="icon" href="img/favicon/favicon.svg?v=${window.APP_VERSION}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png?v=${window.APP_VERSION}">
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png?v=${window.APP_VERSION}">
</head>

<body data-page="bosses">

<div id="header"></div>
<main class="page-content">

<div class="container">
    <h1>Bosses</h1>

    <div class="box">
        <div class="controls">
            <div>
                <div class="muted">Mode</div>
                <div class="mode-tabs">
                    <button id="mode-solo" onclick="setMode('solo')">Solo</button>
                    <button id="mode-duo" onclick="setMode('duo')">Duo</button>
                    <button id="mode-trio" onclick="setMode('trio')">Trio</button>
                </div>
            </div>

            <div>
                <label class="muted">Search</label>
                <input
                    id="bossSearch"
                    placeholder="Search boss..."
                    oninput="setBossSearch(this.value)"
                />
            </div>
        </div>

        <div class="legend">
            <span>⚔️ Phys</span>
            <span>🗡️ Slash</span>
            <span>🔨 Strike</span>
            <span>🏹 Pierce</span>
            <span>✨ Magic</span>
            <span>🔥 Fire</span>
            <span>⚡ Lightning</span>
            <span>☀️ Holy</span>
            <span>🩸 Bleed</span>
            <span>❄️ Frost</span>
            <span>💤 Sleep</span>
            <span>👁️ Madness</span>
            <span>T1/T2/T3 = Tier</span>
            <span>Crtr = Crater</span>
            <span>Nok = Noklateo</span>
            <span>Mtn = Mountaintops</span>
        </div>
    </div>

    <div id="bossCategories"></div>
</div>
</main>
<div id="footer"></div>

<script>
fetch(`components/footer.html?v=${window.APP_VERSION}`)
    .then(res => res.text())
    .then(data => {
        document.getElementById("footer").innerHTML = data;
    });
</script>
</body>
</html>
